name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          printf 'storePassword=%s\n' "${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          printf 'keyPassword=%s\n'   "${{ secrets.KEY_PASSWORD }}"      >> android/key.properties
          printf 'keyAlias=%s\n'      "${{ secrets.KEY_ALIAS }}"         >> android/key.properties
          printf 'storeFile=%s\n'     "upload-keystore.jks"              >> android/key.properties

      - name: Create local.properties
        run: |
          printf 'sdk.dir=%s\n'              "$ANDROID_SDK_ROOT" > android/local.properties
          printf 'flutter.sdk=%s\n'          "$FLUTTER_ROOT"     >> android/local.properties
          printf 'flutter.buildMode=%s\n'    "release"           >> android/local.properties
          printf 'flutter.versionName=%s\n'  "1.0.0"             >> android/local.properties
          printf 'flutter.versionCode=%s\n'  "1"                 >> android/local.properties
      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json

      - name: Flutter pub get
        run: flutter pub get
        env:
          PUB_HOSTED_URL: https://pub.dev
          FLUTTER_STORAGE_BASE_URL: ${{ secrets.FLUTTER_STORAGE_BASE_URL }}

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
        env:
          FLUTTER_STORAGE_BASE_URL: ${{ secrets.FLUTTER_STORAGE_BASE_URL }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quizlo-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # - name: Upload build log on failure
      #   if: failure()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: build-log-${{ github.run_number }}
      #     path: build_output.txt
      #     retention-days: 7