name: quizlo_app
description: Quizlo — Exam Preparation App for Bangladesh
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5

  # Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0

  # Routing
  go_router: ^14.2.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI & Fonts
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  confetti: ^0.7.0
  shimmer: ^3.0.0

  # OTP Input
  pinput: ^5.0.0

  # Audio
  just_audio: ^0.9.39
  vibration: ^1.9.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.4.0
  connectivity_plus: ^6.0.3
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.2
  flutter_timezone: ^2.0.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  package_info_plus: ^8.0.0
  cupertino_icons: ^1.0.8 
  fluttertoast: ^8.2.8

dependency_overrides:
  analyzer: 6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.13
  mocktail: ^1.0.4
  hive_generator: ^2.0.1
  retrofit_generator: ^8.1.0
  flutter_launcher_icons: ^0.13.1  # 1. This installs the package

# 2. This configures the package (Notice it has ZERO spaces on the left)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/logo.png" 

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/
    - assets/audio/

    
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
